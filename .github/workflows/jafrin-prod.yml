name: Jafrin Production CD

on:
  push:
    branches: [jafrin-prod]

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Generate .env
        run: |
          envsubst "`printf '${%s} ' $(sh -c "env|cut -d'=' -f1")`" < ./environments/example.env > ./environments/$NODE_ENV.env
        env:
          PORT: 5001
          NODE_ENV: production
          APP_IDENTIFIER: jafrin-production
          APP_TITLE: Jafrin Homemade Food
          API_PREFIX: api/v1
          TZ: UTC

          # Swagger
          API_VERSION: 1.0.0
          API_TITLE: Jafrin Homemade Food API PRODUCTION
          API_DESCRIPTION: Jafrin Homemade Food API PRODUCTION

          # Default DB
          DB_TYPE: postgres
          DB_HOST: ${{ secrets.PRODUCTION_HOST }}
          DB_PORT: 5432
          DB_USERNAME: ${{ secrets.PRODUCTION_POSTGRES_USER }}
          DB_PASSWORD: ${{ secrets.PRODUCTION_POSTGRES_PASS }}
          DB_DATABASE: secure-jafrinshomemadefood_db
          DB_SYNCHRONIZE: true
          DB_LOGGING: false

          # Security
          CORS_ALLOWED_ORIGINS: https://api.jafrinshomemadefood.com,https://panel.jafrinshomemadefood.com,https://beta.jafrinshomemadefood.com,https://jafrinshomemadefood.com,https://www.jafrinshomemadefood.com
          RATE_LIMIT_TTL: 60000
          RATE_LIMIT_MAX: 100

          # Logger
          LOG_FOLDER: logs

          # JWT
          JWT_SECRET: ssh-rsa 
          JWT_SALT_ROUNDS: 10
          JWT_EXPIRES_IN: 10d
          JWT_REFRESH_TOKEN_EXPIRES_IN: 30d

          # Auth
          OTP_EXPIRES_IN: 5000

          WEB_PANEL_LOGIN_LINK: https://jafrinshomemadefood.com/auth
          INTERNAL_PANEL_LOGIN_LINK: https://panel.jafrinshomemadefood.com/auth

          # Seed Database
          SUPER_ADMIN_EMAIL: superadmin@jafrinshomemadefood.com
          SUPER_ADMIN_PASSWORD: super@Jafrin

          #QUEUE
          QUEUE_HOST: redis
          QUEUE_PORT: 6379
          QUEUE_PASSWORD: 'PiTech.domanaged#redis'

          # Cache
          CACHE_API_DATA: false
          CACHE_TTL: 60
          CACHE_MAX: 100
          CACHE_STORE_HOST: redis
          CACHE_STORE_PORT: 6379
          CACHE_STORE_PASSWORD: 'PiTech.domanaged#redis'
          CACHE_STORE_USERNAME: default

          #SMTP
          SMTP_HOST: smtp-relay.brevo.com
          SMTP_PORT: 2525
          SMTP_SECURE: false
          SMTP_AUTH_USER: 7b86340011@smtp-brevo.com
          SMTP_AUTH_PASS: r4HCV8GL7ywshP9BX
          SMTP_EMAIL: hello@jafrinshomemadefood.com

          BKASH_TOKEN_URL: https://tokenized.sandbox.bka.sh/v1.2.0-beta/tokenized/checkout/token/grant
          BKASH_CREATE_URL: https://tokenized.sandbox.bka.sh/v1.2.0-beta/tokenized/checkout/create
          BKASH_EXECUTE_URL: https://tokenized.sandbox.bka.sh/v1.2.0-beta/tokenized/checkout/execute
          BKASH_PAYMENT_STATUS_URL: https://tokenized.sandbox.bka.sh/v1.2.0-beta/tokenized/checkout/payment/status
          BKASH_SEARCH_TRANSACTION_URL: https://tokenized.sandbox.bka.sh/v1.2.0-beta/tokenized/checkout/general/searchTransaction
          BKASH_REFUND_TRANSACTION_URL: https://tokenized.sandbox.bka.sh/v1.2.0-beta/tokenized/checkout/payment/refund
          BKASH_APP_KEY: 4f6o0cjiki2rfm34kfdadl1eqq
          BKASH_APP_SECRET: 2is7hdktrekvrbljjh44ll3d9l1dtjo4pasmjvs5vl5qr3fug4b
          BKASH_USERNAME: sandboxTokenizedUser02
          BKASH_PASSWORD: sandboxTokenizedUser02@12345
          BKASH_WEB_HOOK_URL: https://api.jafrinshomemadefood.com/api/v1/web/payment-gateway-requests/bkash/webhook

          CORE_API_ENDPOINT: https://api.jafrinshomemadefood.com/api/v1
          WEB_URL: https://jafrinshomemadefood.com

          # SYSTEM CONFIG
          PRODUCT_CODE_PREFIX: JF
          MEMBERSHIP_CODE_PREFIX: JF
          ODER_INVOICE_TEMPLATE: jafrin-order-invoice

      - name: Set up Node.js
        uses: actions/setup-node@v6

      - name: Install dependencies
        run: yarn install --ignore-scripts

      - name: Build the project
        run: yarn run build
        env:
          CI: false

      - name: Deploy Files to Server
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USERNAME }}
          key: ${{ secrets.PRODUCTION_SERVER_SSH_PRIVATE_KEY }}
          rm: true
          source: './' # This will send all files, including the build directory
          target: '/home/pitech/deployed-services/jafrin-api-prod/' # This will send all files, including the build directory
          strip_components: 0

  deploy-jafrin-api-prod-to-DO:
    needs: Build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy api to DigitalOcean Droplet
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.PRODUCTION_HOST }}
          username: ${{ secrets.PRODUCTION_SERVER_USERNAME }}
          key: ${{ secrets.PRODUCTION_SERVER_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            cd /home/pitech/deployed-services/jafrin-api-prod/
            echo "calling shutdown endpoint..."
            docker stop jafrin-api-prod || true
            docker rm jafrin-api-prod || true

            echo "Building the image..."
            docker build -t jafrin-api-prod:local -f /home/pitech/deployed-services/jafrin-api-prod/Dockerfile.prod-jafrin .

            echo "starting server instance..."
            docker run -e NODE_ENV=production -d \
              --restart always \
              -dit --name jafrin-api-prod --network docker_docker_net \
              -p 0.0.0.0:5001:5001 \
              --name jafrin-api-prod \
              -v /home/pitech/deployed-services/jafrin-api-prod/dist:/app/dist \
              jafrin-api-prod:local

            docker builder prune -f
            docker image prune -f
            echo "Deploy Done...."
